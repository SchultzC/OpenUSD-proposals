<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="712" viewBox="0 0 1360 712" role="img" aria-labelledby="title desc">
  <title id="title">OpenUSD scientific data architecture</title>
  <desc id="desc">Diagram showing scientific source formats flowing through vendor file-format adapters into native OpenUSD composition and a candidate scientific data vocabulary, then into ecosystem consumers.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f3437"/>
    </marker>
    <style>
      .label { font: 22px Arial, sans-serif; fill: #111; }
      .small { font: 17px Arial, sans-serif; fill: #111; }
      .tiny { font: 14px Arial, sans-serif; fill: #333; }
      .note { font: italic 14px Arial, sans-serif; fill: #555; }
      .title { font: 25px Arial, sans-serif; font-weight: 700; fill: #111; }
      .box { stroke: #202326; stroke-width: 2; rx: 10; ry: 10; }
      .std { fill: #b8df72; }
      .impl { fill: #ffd98a; }
      .usd { fill: #a8d7e8; }
      .consumer { fill: #d8d8d8; }
      .line { stroke: #2f3437; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .setup { stroke: #2f3437; stroke-width: 2; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- Opaque light canvas so dark text, captions, and connector arrows stay
       readable in GitHub dark mode (README SVGs are embedded via <img>, which
       does not reliably pass the page color scheme into the SVG). -->
  <rect x="0" y="0" width="1360" height="712" fill="#ffffff"/>
  <rect x="6" y="6" width="1348" height="700" fill="none" stroke="#c9ced2" stroke-width="2" rx="8" ry="8"/>

  <rect x="32" y="24" width="1296" height="72" fill="#fff" stroke="#202326" stroke-width="2"/>
  <rect class="box std" x="64" y="42" width="36" height="36"/>
  <text class="small" x="112" y="67">Candidate data-model standardization</text>
  <rect class="box impl" x="438" y="42" width="36" height="36"/>
  <text class="small" x="486" y="67">Vendor- or domain-specific</text>
  <rect class="box usd" x="786" y="42" width="36" height="36"/>
  <text class="small" x="834" y="67">Existing OpenUSD mechanism</text>
  <rect class="box consumer" x="1094" y="42" width="36" height="36"/>
  <text class="small" x="1142" y="67">Ecosystem consumer</text>

  <text class="title" x="48" y="156">Scientific Source Data</text>
  <rect class="box impl" x="48" y="178" width="250" height="72"/>
  <text class="label" x="76" y="222">Solver-native files</text>
  <text class="tiny" x="76" y="242">CGNS, EnSight, OpenFOAM</text>
  <rect class="box impl" x="48" y="276" width="250" height="72"/>
  <text class="label" x="76" y="320">Domain formats</text>
  <text class="tiny" x="76" y="340">Reservoir; EDA, lab (illustrative)</text>
  <rect class="box impl" x="48" y="374" width="250" height="72"/>
  <text class="label" x="76" y="418">Derived datasets</text>
  <text class="tiny" x="76" y="438">Surrogates, deltas, predictions</text>

  <text class="title" x="360" y="156">Runtime data access</text>
  <rect class="box impl" x="360" y="190" width="260" height="92"/>
  <text class="label" x="390" y="230">File-format adapters</text>
  <text class="tiny" x="390" y="254">SdfFileFormat implementations</text>
  <rect class="box impl" x="360" y="330" width="260" height="92"/>
  <text class="label" x="392" y="370">Lazy value providers</text>
  <text class="tiny" x="392" y="394">read heavy arrays from source</text>

  <text class="title" x="688" y="156">Composed USD View</text>
  <rect class="box usd" x="688" y="182" width="292" height="86"/>
  <text class="label" x="724" y="220">USD composition</text>
  <text class="tiny" x="724" y="244">sublayers, references, payloads</text>
  <rect class="box usd" x="688" y="300" width="292" height="86"/>
  <text class="label" x="724" y="338">Native attributes</text>
  <text class="tiny" x="724" y="362">resolved through USD APIs</text>

  <rect class="box std" x="656" y="438" width="356" height="176" stroke="#3f6f12" stroke-width="3.5"/>
  <text class="label" x="698" y="472" font-weight="700">Scientific data vocabulary</text>
  <text class="tiny" x="698" y="498">Dataset, field, and array descriptors</text>
  <text class="tiny" x="698" y="520">Association and topology</text>
  <text class="tiny" x="698" y="542">Time (interpolable); ensembles (discrete)</text>
  <text class="tiny" x="698" y="564">Provenance and traceability</text>
  <text class="tiny" x="698" y="586">Units and physical meaning (open question)</text>
  <text class="tiny" x="698" y="608">Domain and vendor extension points</text>

  <text class="title" x="1062" y="156">Consumers</text>
  <rect class="box consumer" x="1062" y="184" width="250" height="72"/>
  <text class="small" x="1094" y="216">OpenUSD applications</text>
  <text class="tiny" x="1094" y="238">open the stage, no vocabulary</text>
  <rect class="box consumer" x="1062" y="282" width="250" height="72"/>
  <text class="small" x="1094" y="314">Analysis pipelines</text>
  <text class="tiny" x="1094" y="336">query fields through USD</text>
  <rect class="box consumer" x="1062" y="380" width="250" height="72"/>
  <text class="small" x="1094" y="412">Visualization tools</text>
  <text class="tiny" x="1094" y="434">derive views from fields</text>
  <rect class="box consumer" x="1062" y="478" width="250" height="72"/>
  <text class="small" x="1094" y="510">AI and digital twins</text>
  <text class="tiny" x="1094" y="532">combine fields across datasets</text>

  <!-- Every source format enters through a file-format adapter. The adapter
       authors lightweight structure and registers array descriptors with a lazy
       value provider (SdfAbstractData) that reads heavy arrays from source on
       demand. BOTH the structure and the heavy values compose like any other
       opinion; value resolution over the composed layers yields the native
       attributes (so a stronger layer can override them). Array data is never
       copied through the adapter. Matches the reference implementation.
       The typed scientific-data vocabulary and the native value attributes are
       co-resident on the SAME composed prims (the adapter sets prim types and
       applies API schemas at the same SdfPaths the value attrs resolve at), so
       the arrow runs vocabulary -> native value ("names & locates"), NOT
       composition -> native -> vocabulary. Generic OpenUSD apps read the
       composed stage directly; the scientific consumers (analysis, viz, AI)
       key off the vocabulary, which is why three of the four consumer arrows
       originate from the green box. -->
  <path class="line" d="M298 214 C326 214 332 232 360 232"/>
  <path class="line" d="M298 312 C326 312 332 250 360 250"/>
  <path class="line" d="M298 410 C330 410 332 268 360 268"/>
  <path class="setup" d="M490 282 L490 330"/>
  <text class="tiny" x="498" y="313">array descriptors</text>
  <text class="tiny" x="624" y="216">structure</text>
  <path class="line" d="M620 232 C650 232 658 224 688 224"/>
  <path class="line" d="M620 368 C654 368 666 254 688 252"/>
  <text class="tiny" x="694" y="286">heavy array data</text>
  <path class="line" d="M834 268 L834 300"/>
  <text class="tiny" x="846" y="288">value resolution</text>
  <path class="line" d="M834 438 L834 392"/>
  <text class="tiny" x="846" y="418">names &amp; locates values</text>
  <path class="line" d="M980 224 C1024 224 1024 220 1062 220"/>
  <path class="line" d="M1012 452 C1048 452 1044 318 1062 318"/>
  <path class="line" d="M1012 526 C1038 526 1038 416 1062 416"/>
  <path class="line" d="M1012 558 C1038 558 1038 514 1062 514"/>

  <line x1="48" y1="634" x2="1312" y2="634" stroke="#c9ced2" stroke-width="1.5"/>
  <text class="note" x="48" y="660">The adapter registers array descriptors; heavy values are read lazily from source (SdfAbstractData), compose as opinions, and value resolution yields the native attributes.</text>
  <text class="note" x="48" y="684">The vocabulary and those native value attributes are co-resident on the same composed prims: the vocabulary names and locates each value (the standardization target), not one runtime plugin stack.</text>
</svg>
